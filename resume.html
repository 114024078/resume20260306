<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人履歷</title>

<style>
:root {
    --main-color: #b39ddb;
    --main-hover: #9575cd;
    --bg-gradient1: #e6e0ff;
    --bg-gradient2: #f3efff;
}

body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background: #f6f3ff;
    color: #000;
}

/* 主卡片 */
.container {
    max-width: 900px;
    margin: 40px auto;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(120, 90, 200, 0.15);
    overflow: hidden;
}

/* 頭部（維持置中） */
.header {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(135deg, var(--bg-gradient1), var(--bg-gradient2));
}

.header img {
    width: 120px;
    border-radius: 50%;
    border: 5px solid #dcd2ff;
}

.header h1 {
    margin: 10px 0 5px;
    color: #6a5acd;
}

.header p {
    margin: 5px 0;
}

/* 按鈕列 */
.button-row {
    margin-top: 15px;
}

.btn {
    margin: 5px;
    padding: 10px 20px;
    background: var(--main-color);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.btn:hover {
    background: var(--main-hover);
}

/* 區塊 */
.section {
    padding: 20px 30px;
    border-bottom: 1px solid #eee;
}

.section h2 {
    color: #6a5acd;
    border-left: 6px solid var(--main-color);
    padding-left: 10px;
}

/* 技能 & 興趣 */
.skills span {
    display: inline-block;
    background: var(--main-color);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    margin: 5px 5px 0 0;
}

/* 音樂區 */
.music {
    text-align: center;
    padding: 20px;
}

/* 手機版 */
@media (max-width:600px){
    .container {
        margin: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="images/照片.jpg">
        <h1>呂家宜</h1>
        <p>亞洲大學｜學號：AU114024078</p>
        <p>Email:114024078@live.asia.edu.tw｜電話：0912-345-678</p>

        <!-- 👉 按鈕移到下面一行 -->
        <div class="button-row">
            <button class="btn" onclick="window.print()">下載履歷</button>
            <button class="btn" onclick="playMusic()">▶ 音樂</button>
            <button class="btn" onclick="toggleTheme()">🎨 切換顏色</button>
        </div>
    </div>

    <!-- 個性分析 -->
    <div class="section">
        <h2>個性分析</h2>
        <div class="skills">
            <span>樂觀面對</span>
            <span>平易近人</span>
            <span>善解人意</span>
        </div>
    </div>

    <!-- 技能 -->
    <div class="section">
        <h2>技能</h2>
        <div class="skills">
            <span>PPT製作</span>
            <span>Photoshop</span>
            <span>Illustrator</span>
            <span>Procreate</span>
        </div>
    </div>

    <!-- 專案 -->
    <div class="section">
        <h2>專案經驗</h2>
        <p>個人履歷網站（HTML / CSS / JavaScript）</p>
    </div>

    <!-- 興趣 -->
    <div class="section">
        <h2>興趣</h2>
        <div class="skills">
            <span>旅遊</span>
            <span>吃美食</span>
            <span>攝影</span>
        </div>
    </div>

    <!-- 🎵 音樂（保留最底下） -->
    <div class="music">
        <h2>背景音樂</h2>
        <audio id="music" controls loop>
            <source src="audio/music.mp3" type="audio/mpeg">
            你的瀏覽器不支援音樂播放
        </audio>
    </div>

</div>

<script>
function playMusic(){
    var music = document.getElementById("music");
    music.play();
}

/* 🎨 顏色切換 */
let isPurple = true;

function toggleTheme(){
    const root = document.documentElement;

    if(isPurple){
        root.style.setProperty('--main-color', '#f8bbd0');   // 淺粉
        root.style.setProperty('--main-hover', '#f48fb1');
        root.style.setProperty('--bg-gradient1', '#ffe4ec');
        root.style.setProperty('--bg-gradient2', '#fff0f5');
    }else{
        root.style.setProperty('--main-color', '#b39ddb');   // 紫色
        root.style.setProperty('--main-hover', '#9575cd');
        root.style.setProperty('--bg-gradient1', '#e6e0ff');
        root.style.setProperty('--bg-gradient2', '#f3efff');
    }

    isPurple = !isPurple;
}
</script>

</body>
</html>
