<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人履歷</title>

<style>
body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background: #f6f3ff;
    color: #000;
}

/* 主卡片 */
.container {
    max-width: 900px;
    margin: 40px auto;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(120, 90, 200, 0.15);
    overflow: hidden;
}

/* 頭部（改成左右） */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 30px;
    background: linear-gradient(135deg, #e6e0ff, #f3efff);
}

.left {
    display: flex;
    align-items: center;
}

.header img {
    width: 120px;
    border-radius: 50%;
    border: 5px solid #dcd2ff;
    margin-right: 20px;
}

.info h1 {
    margin: 0;
    color: #6a5acd;
}

.info p {
    margin: 5px 0;
}

/* 按鈕區 */
.actions {
    display: flex;
    gap: 10px;
}

.btn {
    padding: 10px 20px;
    background: #b39ddb;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.btn:hover {
    background: #9575cd;
}

/* 區塊 */
.section {
    padding: 20px 30px;
    border-bottom: 1px solid #eee;
}

.section h2 {
    color: #6a5acd;
    border-left: 6px solid #b39ddb;
    padding-left: 10px;
}

/* 技能 & 興趣 共用 */
.skills span {
    display: inline-block;
    background: #b39ddb;
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    margin: 5px 5px 0 0;
}

/* 音樂隱藏 */
audio {
    display: none;
}

/* 手機版 */
@media (max-width:600px){
    .header {
        flex-direction: column;
        text-align: center;
    }
    .left {
        flex-direction: column;
    }
    .header img {
        margin: 0 0 10px 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 頭部 -->
    <div class="header">
        <div class="left">
            <img src="images/照片.jpg">
            <div class="info">
                <h1>呂家宜</h1>
                <p>亞洲大學｜學號：AU114024078</p>
                <p>Email:114024078@live.asia.edu.tw｜電話：0912-345-678</p>
            </div>
        </div>

        <div class="actions">
            <button class="btn" onclick="window.print()">下載履歷</button>
            <button class="btn" onclick="playMusic()">▶ 音樂</button>
        </div>
    </div>

    <!-- 個性分析 -->
    <div class="section">
        <h2>個性分析</h2>
        <div class="skills">
            <span>樂觀面對</span>
            <span>平易近人</span>
            <span>善解人意</span>
        </div>
    </div>

    <!-- 技能 -->
    <div class="section">
        <h2>技能</h2>
        <div class="skills">
            <span>PPT製作</span>
            <span>Photoshop</span>
            <span>Illustrator</span>
            <span>Procreate</span>
        </div>
    </div>

    <!-- 專案 -->
    <div class="section">
        <h2>專案經驗</h2>
        <p>個人履歷網站（HTML / CSS / JavaScript）</p>
    </div>

    <!-- 興趣（改成框框） -->
    <div class="section">
        <h2>興趣</h2>
        <div class="skills">
            <span>旅遊</span>
            <span>吃美食</span>
            <span>攝影</span>
        </div>
    </div>

    <!-- 音樂 -->
    <audio id="music" loop>
        <source src="audio/music.mp3" type="audio/mpeg">
    </audio>

</div>

<script>
function playMusic(){
    var music = document.getElementById("music");
    music.play();
}
</script>

</body>
</html>
