<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人履歷</title>

<style>
:root {
    --main-color: #b39ddb;
    --main-hover: #9575cd;
    --bg-gradient1: #e6e0ff;
    --bg-gradient2: #f3efff;
    --title-color: #6a5acd;
}

body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background: #f6f3ff;
}

/* A4 */
.container {
    max-width: 794px;
    margin: 40px auto;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(120, 90, 200, 0.15);
    overflow: hidden;
    padding-bottom: 30px;
}

/* Header */
.header {
    display: flex;
    align-items: center;
    padding: 40px;
    background: linear-gradient(135deg, var(--bg-gradient1), var(--bg-gradient2));
    position: relative;
}

.header::after {
    content: "✦ ✧ ✦ ✧ ✦ ✧";
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 40px;
    color: rgba(179,157,219,0.25);
}

.header img {
    width: 130px;
    border-radius: 50%;
    border: 6px solid var(--main-color);
    margin-right: 30px;
}

.header, .section, .music {
    animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}

.info h1 {
    margin: 0;
    color: var(--title-color);
}

.eng-name {
    color: #333;
    margin: 5px 0;
}

.button-row {
    margin-top: 10px;
}

.btn {
    margin: 5px;
    padding: 10px 18px;
    background: var(--main-color);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.2s;
}

.btn:hover {
    background: var(--main-hover);
    transform: scale(1.05);
}

.section {
    padding: 20px;
    background: #faf9ff;
    border-radius: 10px;
}

/* ⭐ 一行版 */
.row-2 {
    width: calc(50% - 10px);
}

/* ⭐ 一整行 */
.row-1 {
    width: 100%;
}

/* ⭐ 技能不換行 */
.skills {
    display: flex;
    flex-wrap: nowrap;
    gap: 8px;
}

.skills span {
    background: var(--main-color);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    white-space: nowrap;
}

/* 排版 */
.grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px 30px;
}

/* 音樂 */
.music {
    padding: 20px 30px;
    border-top: 1px solid #eee;
}

/* ⭐ 底線加粗 */
.footer-line {
    height: 10px;
    background: linear-gradient(to right, var(--main-color), var(--main-hover));
    margin: 30px;
    border-radius: 10px;
}

/* 手機 */
@media (max-width:600px){
    .row-2, .row-1 {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="images/照片.jpg">

        <div class="info">
            <h1>呂家宜</h1>
            <p class="eng-name">chia-yi Lu</p>

            <div class="button-row">
                <button class="btn" onclick="window.print()">下載履歷</button>
                <button class="btn" onclick="playMusic()">▶ 音樂</button>
                <button class="btn" onclick="toggleTheme()">🎨 切換顏色</button>
                <button class="btn" onclick="showSurprise()">🎁 小驚喜</button>
            </div>
        </div>
    </div>

    <div class="grid">

        <!-- 聯絡 + 學歷 -->
        <div class="section row-2">
            <h2>聯絡資訊</h2>
            <p>Email：114024078@live.asia.edu.tw｜電話：0912-345-678</p>
        </div>

        <div class="section row-2">
            <h2>學歷</h2>
            <p>亞洲大學｜資傳系</p>
        </div>

        <!-- 個性 + 興趣 -->
        <div class="section row-2">
            <h2>個性分析</h2>
            <div class="skills">
                <span>樂觀面對</span>
                <span>平易近人</span>
                <span>善解人意</span>
            </div>
        </div>

        <div class="section row-2">
            <h2>興趣</h2>
            <div class="skills">
                <span>旅遊</span>
                <span>吃美食</span>
                <span>攝影</span>
            </div>
        </div>

        <!-- 技能 + 專案 同一行 -->
        <div class="section row-2">
            <h2>技能</h2>
            <div class="skills">
                <span>PPT製作</span>
                <span>Photoshop</span>
                <span>Illustrator</span>
                <span>Procreate</span>
            </div>
        </div>

        <div class="section row-2">
            <h2>專案經驗</h2>
            <p>個人履歷網站（HTML / CSS / JavaScript）</p>
        </div>

    </div>

    <div class="music">
        <h2>背景音樂</h2>
        <audio id="music" controls loop>
            <source src="audio/music.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="footer-line"></div>

</div>

<script>
function playMusic(){
    document.getElementById("music").play();
}

let isPurple = true;

function toggleTheme(){
    const root = document.documentElement;

    if(isPurple){
        root.style.setProperty('--main-color', '#f8bbd0');
        root.style.setProperty('--main-hover', '#f48fb1');
        root.style.setProperty('--bg-gradient1', '#ffe4ec');
        root.style.setProperty('--bg-gradient2', '#fff0f5');
        root.style.setProperty('--title-color', '#ec407a');
    }else{
        root.style.setProperty('--main-color', '#b39ddb');
        root.style.setProperty('--main-hover', '#9575cd');
        root.style.setProperty('--bg-gradient1', '#e6e0ff');
        root.style.setProperty('--bg-gradient2', '#f3efff');
        root.style.setProperty('--title-color', '#6a5acd');
    }

    isPurple = !isPurple;
}

function showSurprise() {
    alert("這是小驚喜！🎉");
    window.open("images/surprise.jpg", "_blank");
}
</script>

</body>
</html>
