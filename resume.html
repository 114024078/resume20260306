<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人履歷</title> 

<style>
body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background: #f6f3ff;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(120, 90, 200, 0.15);
    overflow: hidden;
}

.header {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(135deg, #e6e0ff, #f3efff);
}

.header img {
    width: 120px;
    border-radius: 50%;
}

.btn {
    margin-top: 10px;
    padding: 10px 20px;
    background: #b39ddb;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>呂家宜</h1>
        <p>亞洲大學｜資傳系</p>

        <button class="btn" onclick="unmuteMusic()">開啟音樂聲音</button>
    </div>
</div>

<!-- 🎵 自動播放音樂 -->
<audio id="bgm" autoplay loop muted>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("bgm");

// 嘗試自動播放（有些瀏覽器還是會擋）
window.addEventListener("load", () => {
    audio.play().catch(() => {
        console.log("自動播放被阻擋");
    });
});

// 點擊後開聲音
function unmuteMusic() {
    audio.muted = false;
    audio.play();
}
</script>

</body>
</html>
