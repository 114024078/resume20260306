<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人履歷</title>

<style>
:root {
    --main-color: #b39ddb;
    --main-hover: #9575cd;
    --bg-gradient1: #e6e0ff;
    --bg-gradient2: #f3efff;
    --title-color: #6a5acd;
}

body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background: #f6f3ff;
}

/* 主卡片 */
.container {
    max-width: 900px;
    margin: 40px auto;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(120, 90, 200, 0.15);
    overflow: hidden;
}

/* Header */
.header {
    display: flex;
    align-items: center;
    padding: 40px;
    background: linear-gradient(135deg, var(--bg-gradient1), var(--bg-gradient2));
    position: relative;
}

/* 星星 */
.header::after {
    content: "✦ ✧ ✦ ✧ ✦";
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 40px;
    color: rgba(179,157,219,0.25);
}

/* 🎁 小驚喜按鈕 */
.surprise-btn {
    position: absolute;
    top: 60px;
    right: 40px;
    padding: 15px 35px;
    border-radius: 50px;
    background: var(--main-color);
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
}

.surprise-btn:hover {
    background: var(--main-hover);
}

/* 照片 */
.header img {
    width: 130px;
    border-radius: 50%;
    border: 6px solid var(--main-color);
    margin-right: 30px;
}

/* 文字 */
.info h1 {
    margin: 0;
    color: var(--title-color);
}

.eng-name {
    color: #333;
}

/* ✨標語 */
.tagline {
    color: #777;
    font-size: 14px;
}

/* 按鈕 */
.button-row {
    margin-top: 10px;
}

.btn {
    margin: 5px;
    padding: 10px 18px;
    background: var(--main-color);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.btn:hover {
    background: var(--main-hover);
}

/* 區塊 */
.section {
    padding: 20px 30px;
    border-bottom: 1px solid #eee;
    transition: 0.3s;
}

/* ✨滑過效果 */
.section:hover {
    background: #faf7ff;
}

/* 標題 */
.section h2 {
    color: #6a5acd;
    border-left: 6px solid var(--main-color);
    padding-left: 10px;
}

/* 技能 */
.skills span {
    display: inline-block;
    background: var(--main-color);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    margin: 5px;
}

/* 音樂 */
.music {
    padding: 20px 30px;
    border-top: 1px solid #eee;
}

.music h2 {
    color: #6a5acd;
    border-left: 6px solid var(--main-color);
    padding-left: 10px;
}

/* 📸 彈出照片 */
.popup {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}

.popup img {
    width: 300px;
    border-radius: 10px;
}

/* 手機 */
@media (max-width:600px){
    .header {
        flex-direction: column;
        text-align: center;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="images/照片.jpg">

        <div class="info">
            <h1>呂家宜</h1>
            <p class="eng-name">chia-yi Lu</p>
            <p class="tagline">設計學習者｜多媒體創作</p>

            <div class="button-row">
                <button class="btn" onclick="window.print()">下載履歷</button>
                <button class="btn" onclick="playMusic()">▶ 音樂</button>
                <button class="btn" onclick="toggleTheme()">🎨 切換顏色</button>
                <button class="surprise-btn" onclick="showPopup()">小驚喜</button>
                <div class="popup" id="popup" onclick="closePopup()">
    <img src="images/surprise.jpg">
    </div>
            </div>
        </div>
        
    <!-- 其他區塊（略） -->
    <div class="section">
        <h2>個性分析</h2>
        <div class="skills">
            <span>樂觀面對</span>
            <span>平易近人</span>
            <span>善解人意</span>
        </div>
    </div>

    <div class="section">
        <h2>學歷</h2>
        <p>亞洲大學｜資傳系</p>
    </div>

    <div class="section">
        <h2>技能</h2>
        <div class="skills">
            <span>PPT製作</span>
            <span>Photoshop</span>
            <span>Illustrator</span>
            <span>Procreate</span>
        </div>
    </div>

    <div class="section">
        <h2>興趣</h2>
        <div class="skills">
            <span>旅遊</span>
            <span>吃美食</span>
            <span>攝影</span>
        </div>
    </div>

    <div class="section">
        <h2>聯絡資訊</h2>
        <p>Email：114024078@live.asia.edu.tw</p>
        <p>電話：0912-345-678</p>
    </div>

    <div class="music">
        <h2>背景音樂</h2>
        <audio id="music" controls loop>
            <source src="audio/music.mp3">
        </audio>
    </div>

</div>

<!-- 📸 彈出照片 -->
<div class="popup" id="popup" onclick="closePopup()">
    <img src="images/照片.jpg">
</div>

<script>
function playMusic(){
    document.getElementById("music").play();
}

function showPopup(){
    document.getElementById("popup").style.display = "flex";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

let isPurple = true;

function toggleTheme(){
    const root = document.documentElement;

    if(isPurple){
        root.style.setProperty('--main-color', '#f8bbd0');
        root.style.setProperty('--main-hover', '#f48fb1');
        root.style.setProperty('--title-color', '#ec407a');
    }else{
        root.style.setProperty('--main-color', '#b39ddb');
        root.style.setProperty('--main-hover', '#9575cd');
        root.style.setProperty('--title-color', '#6a5acd');
    }

    isPurple = !isPurple;
}
</script>

</body>
</html>
