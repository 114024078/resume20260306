<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人履歷</title> 

<style>
body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background: #f6f3ff;
    color: #000;
}

/* 主卡片 */
.container {
    max-width: 900px;
    margin: 40px auto;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(120, 90, 200, 0.15);
    overflow: hidden;
}

/* 頭部 */
.header {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(135deg, #e6e0ff, #f3efff);
}

.header img {
    width: 120px;
    border-radius: 50%;
    border: 5px solid #dcd2ff;
}

.header h1 {
    margin: 10px 0 5px;
    color: #6a5acd;
}

.header p {
    margin: 5px 0;
}

/* 區塊 */
.section {
    padding: 20px 30px;
    border-bottom: 1px solid #eee;
}

.section h2 {
    color: #6a5acd;
    border-left: 6px solid #b39ddb;
    padding-left: 10px;
}

/* 技能 */
.skills span {
    display: inline-block;
    background: #b39ddb;
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    margin: 5px 5px 0 0;
}

/* 按鈕 */
.btn {
    margin-top: 10px;
    padding: 10px 20px;
    background: #b39ddb;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.btn:hover {
    background: #9575cd;
}

/* 興趣 */
.hobby {
    font-weight: bold;
}

/* 手機版 */
@media (max-width:600px){
    .container {
        margin: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="images/照片.jpg">
        <h1>呂家宜</h1>
        <p>亞洲大學｜學號：AU114024078</p>
        <p>Email:114024078@live.asia.edu.tw｜電話：0912-345-678</p>

        <!-- 原本下載按鈕 -->
        <button class="btn" onclick="window.print()">下載履歷</button>

        <!-- 👉 新增：播放音樂按鈕 -->
        <button class="btn" onclick="playMusic()">播放背景音樂</button>
    </div>

    <div class="section">
        <h2>自我介紹</h2>
        <p>
        我是亞洲大學資傳系的學生，個性細心且負責，對設計與多媒體充滿興趣。
        平時喜歡透過練習與實作提升自己的能力，並持續學習新的技能，
        希望未來能在設計相關領域發展。
        </p>
    </div>

    <div class="section">
        <h2>學歷</h2>
        <p>亞洲大學｜資傳系（2025 - 2029）</p>
    </div>

    <div class="section">
        <h2>技能</h2>
        <div class="skills">
            <span>PPT製作</span>
            <span>Photoshop</span>
            <span>Illustrator</span>
        </div>
    </div>

    <div class="section">
        <h2>專案經驗</h2>
        <p>個人履歷網站（HTML / CSS / JavaScript）</p>
    </div>

    <div class="section">
        <h2>興趣</h2>
        <p class="hobby">旅遊、吃美食、攝影</p>
    </div>

</div>

<!-- 原本播放器（保留） -->
<audio controls loop>
    <source src="audio/music.mp3" type="audio/mpeg">
    你的瀏覽器不支援音樂播放
</audio>

<!-- 背景音樂 -->
<audio id="bgm" loop>
  <source src="audio/music.mp3" type="audio/mpeg">
</audio>

<script>
// 👉 使用者點擊按鈕播放
function playMusic() {
  const audio = document.getElementById("bgm");
  audio.play();
}

// 👉 點擊畫面任何地方也可以播放（加分體驗）
document.addEventListener("click", function () {
  const audio = document.getElementById("bgm");
  audio.play();
}, { once: true });
</script>

</body>
</html>
